<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buffalo — Plastics Accounts & Stock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <div class="logo">B</div>
        <div><strong>Buffalo</strong><small>Plastics · Accounts &amp; Stock</small></div>
      </div>
      <nav id="nav" aria-label="Main"></nav>
      <div id="who" class="who"></div>
      <div class="side-foot">Buffalo · data stored on the server</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="pageTitle">Dashboard</h1>
        <span id="todayLabel" class="mono"></span>
      </header>
      <section id="view"></section>
    </main>
  </div>
  <div id="login" hidden>
    <form id="loginForm" class="login-card">
      <div class="logo">B</div>
      <h1>Buffalo</h1>
      <p>Sign in to continue</p>
      <div class="fld"><label for="lUser">Username</label><input id="lUser" class="form-control" autocomplete="username" required></div>
      <div class="fld"><label for="lPass">Password</label><input id="lPass" type="password" class="form-control" autocomplete="current-password" required></div>
      <div id="lErr" class="login-err" role="alert"></div>
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
